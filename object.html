<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Create object
            const student={
            name: "Muskan",
            class: "B.Tech",
            fee: 100000
        }
        document.write(student.name);
        document.write("<br>"+student.class);
        document.write("<br>"+student.fee);
        console.log(student);
        document.write("<br>"+JSON.stringify(student));
        for(let key in student) {
            document.write("<br>"+student[key]);
        }
        
    </script>
</body>
</html>
