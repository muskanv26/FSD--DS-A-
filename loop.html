<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        //code for (FOR Loop)
        for(let i=1; i<=10; i++) {
            document.write("<br>ABES Engineering College");
        }
        let Car = ["Car1", "Car2", "Car3"];
        let len = Car.length;
        let text = " ";
        for(let i=0; i<len; i++) {
            if(i==1) {
                continue;
            }
                text += Car[i]+"<br>";
        }
        document.getElementById("demo").innerHTML=text;
        let n = prompt("Enter a number");
        let i = 1;
        while(i <= 10) {
            document.write("<br>"+n + "*"+ i + "="+n*i);
            i++;
        }
    </script>
</body>
</html>
