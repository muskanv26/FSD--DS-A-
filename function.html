<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let veh = prompt("Enter the mode of transport");
        if(veh == "car") {
            let num = prompt("Enter number of seats");
            let cost = (num) => num*500;
            document.write(cost(num));
        }
        else if(veh == "chopper") {
            let num = prompt("Enter number of seats");
            let cost = (num) => num*5000;
            document.write(cost(num));
        }
        else if(veh == "aeroplane") {
            let num = prompt("Enter number of seats");
            let cost = (num) => num*10000;
            document.write(cost(num));
        }
    </script>
</body>
</html>
