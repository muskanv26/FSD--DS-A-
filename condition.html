<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condition</title>
</head>
<body>
    <script>
        let number = prompt("enter your number");
        const org = number;
        let sum = 0;
        while(number > 0) {
            let rem = number%10;
            sum = sum + rem*rem*rem;
            number = Math.floor(number/10);
        }
        if(sum == org)
            console.log("Armstrong");
        else
            console.log("Not Armstrong");
    </script>
</body>
</html>
