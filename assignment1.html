<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
</head>

<body style="background-color: lightyellow; font-family: Arial;">

    <h1 style="text-align: center; color: brown;">
        RESTAURANT MENU
    </h1>

    <hr>

    <!-- Main Content -->
    <div style="display: flex;">

        <!-- Left Side: Menu -->
        <div style="width: 50%; padding: 20px;">

            <h2 style="color: darkgreen;">Menu</h2>

            <table border="1" cellpadding="10"
                   style="background-color: white;">
                <tr style="background-color: lightgreen;">
                    <th>Product</th>
                    <th>Price</th>
                </tr>

                <tr>
                    <td>Tea</td>
                    <td>450</td>
                </tr>

                <tr>
                    <td>Coffee</td>
                    <td>600</td>
                </tr>

                <tr>
                    <td>Sugar</td>
                    <td>700</td>
                </tr>

                <tr>
                    <td>Pulses</td>
                    <td>100</td>
                </tr>
            </table>

            <br>

            <label>Enter Product:</label>
            <input type="text" id="product">

            <br><br>

            <label>Enter Quantity:</label>
            <input type="number" id="quantity">

            <br><br>

            <button onclick="calculateBill()"
                    style="background-color: green;
                           color: white;
                           padding: 8px;">
                Calculate Bill
            </button>

            <h3 id="result"></h3>

        </div>


        <!-- Right Side: Images -->
        <div style="width: 50%; padding: 20px;">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRtbqdJ9w7xQVFhwn3lPx0PpGEB-_hwJZZBuPiFRPC7Sc0XkXTJ_QuZgvMO&s=10"
                 height="180"
                 width="180">

            <img src="https://irp.cdn-website.com/cbf48001/dms3rep/multi/shutterstock_2463705563.jpg"
                 height="180"
                 width="180">

            <br><br>

            <img src="https://plus.unsplash.com/premium_photo-1674327105076-36c4419864cf?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8Y29mZmVlJTIwYWVzdGhldGljfGVufDB8fDB8fHww"
                 height="180"
                 width="180">

            <img src="https://food.fnr.sndimg.com/content/dam/images/food/fullset/2016/2/15/0/HE_dried-legumes-istock-2_s4x3.jpg.rend.hgtvcom.1280.1280.85.suffix/1455572939649.webp"
                 height="180"
                 width="180">

        </div>

    </div>


    <script>
        function calculateBill() {

            let product = document.getElementById("product").value;
            let quantity = document.getElementById("quantity").value;

            let price;

            if (product == "Tea") {
                price = 450;
            }
            else if (product == "Coffee") {
                price = 600;
            }
            else if (product == "Sugar") {
                price = 700;
            }
            else if (product == "Pulses") {
                price = 100;
            }
            else {
                document.getElementById("result").innerHTML =
                    "Product not available";
                return;
            }

            let total = price * quantity;

            document.getElementById("result").innerHTML =
                "Total Amount: " + total;
        }
    </script>

</body>
</html>
